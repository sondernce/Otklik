<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Доступ к аккаунту · Отклик</title><link rel="stylesheet" href="/static/css/styles.css"><link rel="stylesheet" href="/static/css/admin.css"><script defer src="/static/js/http.js"></script><script defer src="/static/js/form-errors.js"></script><script defer src="/static/js/account-access.js"></script></head><body><header class="header wrap"><a class="brand" href="/">отклик</a><a class="text-button" href="/">На сайт</a></header><main class="wrap admin-main"><section class="panel auth-panel"><h1 id="access-title">Доступ к аккаунту</h1><p id="access-hint" class="subtext"></p><p id="access-message" role="status" aria-live="polite"></p>
<form id="access-request" novalidate hidden><label>Кабинет<select id="access-role"><option value="client">Клиента</option><option value="psychologist">Психолога</option></select></label><label>Электронная почта<input id="access-email" type="email" autocomplete="email" maxlength="200" required></label><button class="primary">Получить ссылку</button></form>
<form id="access-confirm" hidden><button class="primary">Подтвердить почту</button></form>
<form id="access-reset" novalidate hidden><label>Новый пароль · от 8 символов<input id="access-password" type="password" autocomplete="new-password" minlength="8" maxlength="200" required></label><label>Повторите пароль<input id="access-password-repeat" type="password" autocomplete="new-password" minlength="8" maxlength="200" required></label><button class="primary">Сохранить новый пароль</button></form>
<p><a id="access-back" class="text-button" href="/client">Вернуться к входу</a></p></section></main></body></html>
